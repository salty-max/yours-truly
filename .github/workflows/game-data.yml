# Every day, and by hand: Yours Truly's game data built again from wow-data's
# pins (salty-max/wow-data's addon-data.yml: wow-data beside it, the
# databases downloaded; addon-kit beside it, for the check): each game's
# letters (their anchors, writers and places checked in that game, the
# anchors' levels, the zones) and the names they need in every language, then
# the language files. When one changes, a pull request with the checks run,
# then merged by itself and told to the owner's phone.
name: Game data

# (the CI gate's trial, a scratch branch: wow-data's ci-gate branch, and a
# stamp file so every run has a change to open a pull request with)
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # (ci.yml asked for on the pull request's branch, the gate before the merge)
  actions: write

jobs:
  data:
    uses: salty-max/wow-data/.github/workflows/addon-data.yml@ci-gate
    secrets:
      INBOX_EVENTS_TOKEN: ${{ secrets.INBOX_EVENTS_TOKEN }}
    with:
      kit: true
      generate: |
        # (esMX's game names from wow-data, the hand file's words beside them)
        bun scripts/root.ts --run addon-kit/regional.ts
        bun scripts/letters.ts
        bun scripts/locales.ts
        mkdir -p trial && date -u +%FT%TZ > trial/stamp.txt
      paths: |
        trial
        i18n
        addon/YoursTruly
